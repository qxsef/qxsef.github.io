<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qxsef | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Variabel Warna */
        :root {
            --bg-body: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --accent: #00d2ff;
            --btn-hover: #00d2ff;
        }

        /* Variabel untuk Light Mode */
        .light-mode {
            --bg-body: #f0f2f5;
            --card-bg: rgba(0, 0, 0, 0.05);
            --text-main: #1a1a2e;
            --accent: #ff4757;
            --btn-hover: #ff4757;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        /* Tombol Toggle */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            margin-bottom: 20px;
            padding: 5px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 25px; }

        .links { display: flex; flex-direction: column; gap: 15px; }

        .link-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .link-btn:hover {
            background: var(--btn-hover);
            color: #fff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="theme-toggle" onclick="toggleTheme()">Mode</button>
        
        <img src="https://github.com/qxsef.png" alt="Profile" class="avatar">
        <h1>qxsef</h1>
        <p>Creative Developer & Content Creator</p>

        <div class="links">
            <a href="https://github.com/qxsef" class="link-btn" target="_blank">GitHub</a>
            <a href="https://www.instagram.com/quixotea_" class="link-btn" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@quixotea" class="link-btn" target="_blank">TikTok</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>

</body>
</html>
