<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldymea N. | QXSEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* PRELOADER */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-text {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            animation: textSwitch 3s forwards;
        }

        @keyframes textSwitch {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            40% { opacity: 1; }
            50% { opacity: 0; transform: translateY(-10px); }
            65% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* CONTAINER UTAMA */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* NAVIGASI MENU */
        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: #888;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
        }

        /* LOGO BRAND */
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .logo-box span {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* TALI PANJANG ELASTIS (CANVAS) */
        .lanyard-container {
            position: relative;
            width: 100%;
            height: 180px; /* Diperpanjang agar tali lebih panjang */
            margin-bottom: -10px;
        }

        canvas#ropeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ID CARD */
        .id-card-wrapper {
            position: relative;
            z-index: 2;
        }

        .id-card {
            background: #ffffff;
            color: #121212;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            cursor: grab;
            user-select: none;
            touch-action: none;
            will-change: transform;
        }

        .id-card:active {
            cursor: grabbing;
        }

        .photo-frame {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #222;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-family: 'Reenie Beanie', cursive;
            font-size: 2.2rem;
            color: rgba(255, 255, 255, 0.85);
            transform: rotate(-5deg);
        }

        /* DESKRIPSI TEKS & ANIMASI KETIK */
        .intro-text {
            margin-top: 25px;
            text-align: left;
        }

        .intro-text h3 {
            font-size: 1rem;
            color: #aaa;
            font-weight: 400;
        }

        .intro-text h3 span {
            color: #fff;
            font-weight: 700;
        }

        .intro-text h1 {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 5px 0 12px 0;
        }

        .typing-container {
            font-size: 0.9rem;
            color: #b3b3b3;
            line-height: 1.6;
            min-height: 90px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #fff;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* TOMBOL SOSIAL MEDIA DENGAN LOGO SVG */
        .social-links {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #181818;
            color: #fff;
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #2a2a2a;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="loader">
        <div class="loader-text" id="loaderText">QXSEF</div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="container" id="mainContent">
        
        <!-- NAVIGASI MENU -->
        <nav>
            <a href="#" class="active">Home</a> •
            <a href="#">About</a> •
            <a href="#">Portfolio</a> •
            <a href="#">Prices</a> •
            <a href="#">Testimoni</a>
        </nav>

        <!-- LOGO BRAND -->
        <div class="logo-box">
            <span>QXSEF</span>
        </div>

        <!-- TALI ID CARD PANJANG -->
        <div class="lanyard-container">
            <canvas id="ropeCanvas"></canvas>
        </div>

        <!-- ID CARD LENTUR -->
        <div class="id-card-wrapper">
            <div class="id-card" id="idCard">
                <div class="photo-frame">
                    <img src="https://github.com/qxsef.png" alt="Aldymea Nurhakim">
                    <div class="watermark">Aldymea</div>
                </div>
            </div>
        </div>

        <!-- DESKRIPSI -->
        <div class="intro-text">
            <h3>Halo! Saya <span>Aldymea N.</span></h3>
            <h1>Siswa TJKT.</h1>
            <div class="typing-container">
                <span id="typedText"></span><span class="cursor">&nbsp;</span>
            </div>
        </div>

        <!-- SOSIAL MEDIA -->
        <div class="social-links">
            <!-- WhatsApp -->
            <a href="https://wa.me/6281977280287" target="_blank" class="btn">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                    <span>WhatsApp</span>
                </div>
                <span>↗</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/quixotea_" target="_blank" class="btn">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    <span>Instagram</span>
                </div>
                <span>↗</span>
            </a>
        </div>
    </div>

    <script>
        // PRELOADER TEXT
        const loaderText = document.getElementById('loaderText');
        setTimeout(() => { loaderText.innerText = "Aldymea Nurhakim"; }, 1500);

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                document.getElementById('loader').style.visibility = 'hidden';
                document.getElementById('mainContent').classList.add('show');
                initRope();
                startTyping();
            }, 3000);
        });

        // ANIMASI TYPEWRITER
        const textToType = "Saya mahir CapCut, dan familiar VS Code — menghasilkan kode.";
        let typeIndex = 0;

        function startTyping() {
            if (typeIndex < textToType.length) {
                document.getElementById("typedText").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(startTyping, 35);
            }
        }

        // SIMULASI TALI PANJANG & ELASTIS
        const card = document.getElementById('idCard');
        const canvas = document.getElementById('ropeCanvas');
        const ctx = canvas.getContext('2d');

        let isDragging = false;
        let startX, startY;
        let posX = 0, posY = 0;
        let velX = 0, velY = 0;

        function initRope() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            updatePhysics();
        }

        function drawRope() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            
            // Titik awal tali di atas
            ctx.moveTo(canvas.width / 2, 0);
            
            // Posisi ujung tali yang tersambung ke ID Card
            const anchorX = canvas.width / 2 + posX * 0.6;
            const anchorY = canvas.height + posY;
            
            // Menggambar Tali Melengkung Dinamis
            ctx.quadraticCurveTo(canvas.width / 2 + posX * 0.2, canvas.height / 2 + posY * 0.5, anchorX, anchorY);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Gantungan Ring ID Card
            ctx.beginPath();
            ctx.arc(anchorX, anchorY - 4, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#888';
            ctx.fill();
        }

        function updatePhysics() {
            if (!isDragging) {
                // Fisika Pegas (Return Spring Force)
                let forceX = -posX * 0.12;
                let forceY = -posY * 0.12;

                velX = (velX + forceX) * 0.80; // Damping
                velY = (velY + forceY) * 0.80;

                posX += velX;
                posY += velY;
            }

            const rotX = posY * -0.12;
            const rotY = posX * 0.12;
            card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            drawRope();
            requestAnimationFrame(updatePhysics);
        }

        function startDrag(e) {
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            startX = clientX - posX;
            startY = clientY - posY;
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            posX = (clientX - startX);
            posY = (clientY - startY);
        }

        function endDrag() {
            isDragging = false;
        }

        card.addEventListener('mousedown', startDrag);
        card.addEventListener('touchstart', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag);
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });
    </script>
</body>
</html>
