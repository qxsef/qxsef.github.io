i<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldymea N. | Portfolio</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e, #16213e);
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #00d2ff; /* Warna neon cyan */
            --text-color: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            margin-bottom: 20px;
            padding: 5px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 25px; }

        .links { display: flex; flex-direction: column; gap: 15px; }

        .link-btn {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .link-btn:hover {
            background: var(--accent);
            color: #000;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://github.com/qxsef.png" alt="Profile" class="avatar">
        <h1>qxsef</h1>
        <p>Creative Developer & Content Creator</p>

        <div class="links">
            <a href="https://github.com/qxsef" class="link-btn" target="_blank">GitHub</a>
            <a href="https://www.instagram.com/quixotea_" class="link-btn" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@quixotea" class="link-btn" target="_blank">TikTok</a>
        </div>
    </div>

</body>
</html>
