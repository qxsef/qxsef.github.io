<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldymea N. | QXSEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PRELOADER ANIMASI */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-text {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            animation: textSwitch 3s forwards;
        }

        @keyframes textSwitch {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            40% { opacity: 1; }
            50% { opacity: 0; transform: translateY(-10px); }
            65% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* CONTAINER UTAMA */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* LOGO BRAND KEREN */
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 30px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .logo-box span {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* SIMULASI TALI LENTUR (CANVAS) */
        .lanyard-container {
            position: relative;
            width: 100%;
            height: 100px;
            margin-bottom: -10px;
        }

        canvas#ropeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ID CARD ELASTIS */
        .id-card-wrapper {
            position: relative;
            z-index: 2;
            perspective: 1000px;
        }

        .id-card {
            background: #ffffff;
            color: #121212;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            cursor: grab;
            user-select: none;
            transform-origin: top center;
            touch-action: none;
        }

        .id-card:active {
            cursor: grabbing;
        }

        .photo-frame {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            background: #333;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-family: 'Reenie Beanie', cursive;
            font-size: 2.2rem;
            color: rgba(255, 255, 255, 0.8);
            transform: rotate(-5deg);
        }

        /* DESKRIPSI JURUSAN TJKT */
        .intro-text {
            margin-top: 25px;
            text-align: left;
        }

        .intro-text h3 {
            font-size: 1.1rem;
            color: #aaa;
            font-weight: 400;
        }

        .intro-text h3 span {
            color: #fff;
            font-weight: 700;
        }

        .intro-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 5px 0 12px 0;
        }

        .intro-text p {
            font-size: 0.9rem;
            color: #999;
            line-height: 1.6;
        }

        /* TOMBOL SOSIAL MEDIA */
        .social-links {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #1e1e1e;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #333;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="loader">
        <div class="loader-text" id="loaderText">QXSEF</div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="container" id="mainContent">
        
        <!-- LOGO BRAND -->
        <div class="logo-box">
            <span>QXSEF</span>
        </div>

        <!-- TALI ID CARD (DRAWN VIA CANVAS) -->
        <div class="lanyard-container">
            <canvas id="ropeCanvas"></canvas>
        </div>

        <!-- ID CARD LENTUR -->
        <div class="id-card-wrapper">
            <div class="id-card" id="idCard">
                <div class="photo-frame">
                    <img src="https://github.com/qxsef.png" alt="Aldymea Nurhakim">
                    <div class="watermark">Aldymea</div>
                </div>
            </div>
        </div>

        <!-- DESKRIPSI -->
        <div class="intro-text">
            <h3>Halo! Saya <span>Aldymea N.</span></h3>
            <h1>Siswa TJKT.</h1>
            <p>Fokus pada Teknik Jaringan Komputer dan Telekomunikasi. Berpengalaman dalam konfigurasi jaringan, sistem komputer, serta antusias dalam dunia pengembangan web dan teknologi digital.</p>
        </div>

        <!-- LINKS -->
        <div class="social-links">
            <a href="https://github.com/qxsef" target="_blank" class="btn">
                <span>GitHub</span> <span>↗</span>
            </a>
            <a href="https://www.instagram.com/quixotea_" target="_blank" class="btn">
                <span>Instagram</span> <span>↗</span>
            </a>
            <a href="https://www.tiktok.com/@quixotea" target="_blank" class="btn">
                <span>TikTok</span> <span>↗</span>
            </a>
        </div>
    </div>

    <script>
        // ANIMASI LOADING
        const loaderText = document.getElementById('loaderText');
        setTimeout(() => { loaderText.innerText = "Aldymea Nurhakim"; }, 1500);

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                document.getElementById('loader').style.visibility = 'hidden';
                document.getElementById('mainContent').classList.add('show');
                initRope();
            }, 3000);
        });

        // SIMULASI FISIKA ELASTIS ID CARD & TALI
        const card = document.getElementById('idCard');
        const canvas = document.getElementById('ropeCanvas');
        const ctx = canvas.getContext('2d');

        let isDragging = false;
        let startX, startY;
        let posX = 0, posY = 0;
        let velX = 0, velY = 0;

        function initRope() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            updatePhysics();
        }

        function drawRope() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            
            // Menggambar Tali Elastis Mengikuti Gerakan Kartu
            const anchorX = canvas.width / 2 + posX * 0.5;
            const anchorY = canvas.height + posY;
            
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height / 2, anchorX, anchorY);
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(anchorX, anchorY - 4, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#888';
            ctx.fill();
        }

        function updatePhysics() {
            if (!isDragging) {
                // Perhitungan Gaya Pegas (Spring Physics)
                let forceX = -posX * 0.15;
                let forceY = -posY * 0.15;

                velX = (velX + forceX) * 0.75; // Redaman (Damping)
                velY = (velY + forceY) * 0.75;

                posX += velX;
                posY += velY;
            }

            const rotX = posY * -0.15;
            const rotY = posX * 0.15;
            card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            drawRope();
            requestAnimationFrame(updatePhysics);
        }

        function startDrag(e) {
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            startX = clientX - posX;
            startY = clientY - posY;
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            posX = (clientX - startX) * 0.8;
            posY = (clientY - startY) * 0.8;
        }

        function endDrag() {
            isDragging = false;
        }

        card.addEventListener('mousedown', startDrag);
        card.addEventListener('touchstart', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag);
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });
    </script>
</body>
</html>
